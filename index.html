<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Media</title>
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; text-align: center; width: 85%; max-width: 350px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .btn { display: block; background: #25d366; color: white; text-decoration: none; padding: 12px; margin: 10px 0; border-radius: 8px; font-weight: bold; }
        .btn-yt { background: #ff0000; }
    </style>
</head>
<body>
    <div class="card">
        <h3>VERIFIKASI MEDIA</h3>
        <!-- Ganti href di bawah ini dengan link YouTube Saluran Anda -->
        <a class="btn btn-yt" href="https://www.youtube.com/@SaluranKamu" target="_blank">Subscribe YouTube</a>
        
        <!-- Ganti href di bawah ini dengan link Grup/Saluran WhatsApp Anda -->
        <a class="btn" href="https://chat.whatsapp.com/KodeGrupKamu" target="_blank">Join WhatsApp</a>
    </div>
</body>
</html>
